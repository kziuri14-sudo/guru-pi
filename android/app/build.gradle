plugins { id 'com.android.application' }
android {
    namespace 'lt.guru.app'
    compileSdk 34
    defaultConfig {
        applicationId 'lt.guru.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    // pastovus parašas – kad naujos versijos įsidiegtų ant senos (be ištrynimo)
    signingConfigs {
        guru { storeFile file('guru.keystore'); storePassword 'gurupass'; keyAlias 'guru'; keyPassword 'gurupass' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.guru }
        release { signingConfig signingConfigs.guru; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
